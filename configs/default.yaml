horizon_days: 7          # prédire le bloom à J+7

data:
  path: null             # chemin CSV/Parquet réel ; null => données synthétiques
  synthetic:
    n_sites: 30
    n_days: 730
    seed: 0

features:
  variables: [sst, rain, nitrate, wind, par, ndvi, ndci, fai, mci]
  lags: [1, 3, 7, 14]
  windows: [7, 30]

split:
  test_start: "2024-07-01"

model:
  max_iter: 300
  learning_rate: 0.05
  max_leaf_nodes: 31
  class_weight: balanced
