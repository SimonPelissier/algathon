# Détection des ulves sur Sentinel-2 L2A (Microsoft Planetary Computer, sans compte).
# Les baies et leurs emprises sont dans configs/baies.yaml.

stac:
  url: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: sentinel-2-l2a
  nuages_tuile_max: 60        # filtre grossier au niveau de la tuile (100 x 100 km)

# Zone analysée = polygones des sites CEVA de la baie ∩ classes ESA WorldCover 2021 gardées.
# On exclut ainsi la terre, les champs et surtout les prés salés (herbus), dont le NDVI
# est élevé toute l'année et serait confondu avec des ulves.
worldcover:
  collection: esa-worldcover
  annee: 2021
  classes_gardees: [60, 80]   # 60 sol nu / végétation clairsemée (estran), 80 eau

# Classes SCL écartées : 0 pas de donnée, 1 saturé, 3 ombre de nuage, 8-9 nuages, 10 cirrus
scl_invalides: [0, 1, 3, 8, 9, 10]

# Seuils NDVI testés : le bon seuil est choisi en comparant aux cumuls CEVA (calibration).
seuils_ndvi: [0.10, 0.15, 0.20, 0.25, 0.30, 0.40]

selection:
  part_valide_min: 0.90       # part de la zone sans nuage ni trou pour garder une scène
  mois_ceva: [5, 7, 9]        # mois des survols CEVA (mai, juillet, septembre)

periode:
  annees: [2016, 2025]        # Sentinel-2 L2A disponible à partir de juillet 2015
  mois: [4, 5, 6, 7, 8, 9, 10]
